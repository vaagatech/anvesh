<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10243F" />
      <stop offset="100%" stop-color="#0D1B2A" />
    </linearGradient>
    <linearGradient id="cobalt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" stroke="rgba(255,255,255,0.18)" stroke-width="2" />

  <!-- Anvesh 'A' + Lens Outer Ring -->
  <circle cx="30" cy="28" r="14" fill="none" stroke="url(#cobalt)" stroke-width="4.5" filter="url(#glow)" />

  <!-- Search Handle -->
  <path d="M40 38 L51 49" stroke="url(#cobalt)" stroke-width="5" stroke-linecap="round" filter="url(#glow)" />

  <!-- Inner Amber Signal Core Dot -->
  <circle cx="30" cy="28" r="4.5" fill="#FBBF24" />
</svg>
