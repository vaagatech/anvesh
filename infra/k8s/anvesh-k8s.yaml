# =========================================================================
# Anvesh Microservices Platform for K3s (OCI)
# Includes: Engine, Spider, Indexer, Hub, Redis Queues, Shared PVC, HPA (75%)
# Lightweight & Cloud-Native (Resource-guarded, sub-100MB RAM/pod)
# =========================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: anvesh
  labels:
    app.kubernetes.io/part-of: anvesh
    app.kubernetes.io/vendor: vaagatech
---
# Shared Persistent Volume Claim for document corpora, crawl dumps, & index shards
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: anvesh-shared-data-pvc
  namespace: anvesh
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
# 1. Anvesh Redis Deployment (Distributed Queue, Task Buffer & Pub/Sub)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: anvesh-redis
  namespace: anvesh
  labels:
    app.kubernetes.io/name: anvesh-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: anvesh-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: anvesh-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: anvesh-redis
  namespace: anvesh
  labels:
    app.kubernetes.io/name: anvesh-redis
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: anvesh-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
# Common Configuration across Anvesh microservices
apiVersion: v1
kind: ConfigMap
metadata:
  name: anvesh-config
  namespace: anvesh
data:
  ANVESH_STORAGE: "tiered"
  ANVESH_DATA_DIR: "/data/engine"
  ANVESH_SPIDER_DATA_DIR: "/data/spider"
  ANVESH_INDEXER_DATA_DIR: "/data/indexer"
  ANVESH_HUB_DATA: "/data/hub"
  REDIS_URL: "redis://anvesh-redis:6379"
  ANVESH_S3_BUCKET: "anvesh-indexes-v8tam2"
  ANVESH_S3_ENDPOINT: "https://axkdaujrafzw.compat.objectstorage.ap-hyderabad-1.oraclecloud.com"
  ANVESH_S3_REGION: "us-east-1"
  ANVESH_S3_PREFIX: "anvesh/indexes/"
  ANVESH_PORT: "3848"
  ANVESH_HUB_PORT: "3849"
  ANVESH_SPIDER_PORT: "3851"
  ANVESH_INDEXER_PORT: "3852"
  ANVESH_HOST: "0.0.0.0"
  ANVESH_LOG_PRETTY: "0"
  ANVESH_CORS_ORIGIN: "*"
  ANVESH_RATE_LIMIT: "120"
  ANVESH_HUB_ADMIN_USER: "admin"
  ANVESH_ENGINE_BASE_URL: "http://anvesh-engine-service:3848"
  ANVESH_SPIDER_BASE_URL: "http://anvesh-spider-service:3851"
  ANVESH_INDEXER_BASE_URL: "http://anvesh-indexer-service:3852"
---
apiVersion: v1
kind: Secret
metadata:
  name: anvesh-secrets
  namespace: anvesh
type: Opaque
stringData:
  ANVESH_API_KEY: "anvesh-k3s-secret-key"
  ANVESH_SPIDER_API_KEY: "anvesh-k3s-secret-key"
  ANVESH_INDEXER_API_KEY: "anvesh-k3s-secret-key"
  ANVESH_HUB_ADMIN_PASSWORD: "anveshPassword"
  AWS_ACCESS_KEY_ID: "f2b26cd63c9ca87fd8baf135dae17aeca4c18d22"
  AWS_SECRET_ACCESS_KEY: "Ey3DP/TKvlNMuXXd9bBmOdSiu+8PuQI8rS63kkQuQdY="
---
# 2. Anvesh Engine Microservice (Querying & Real-time Search on Port 3848)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: anvesh-engine
  namespace: anvesh
  labels:
    app.kubernetes.io/name: anvesh-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: anvesh-engine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: anvesh-engine
    spec:
      imagePullSecrets:
        - name: ocir-secret
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: anvesh-engine
          image: hyd.ocir.io/axkdaujrafzw/anvesh-engine:latest
          imagePullPolicy: Always
          command: ["node", "apps/engine/dist/cli.js", "serve"]
          ports:
            - name: http
              containerPort: 3848
          envFrom:
            - configMapRef:
                name: anvesh-config
            - secretRef:
                name: anvesh-secrets
          volumeMounts:
            - name: shared-data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 3848
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 3848
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: shared-data
          persistentVolumeClaim:
            claimName: anvesh-shared-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: anvesh-engine-service
  namespace: anvesh
  labels:
    app.kubernetes.io/name: anvesh-engine
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: anvesh-engine
  ports:
    - name: http
      port: 3848
      targetPort: 3848
---
