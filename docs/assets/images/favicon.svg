<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="fav-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#fav-bg)" />
  <rect x="2" y="2" width="60" height="60" rx="16" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />

  <!-- Hex Prism Facet Background -->
  <path d="M32 10 L48 19 L48 37 L32 46 L16 37 L16 19 Z" 
        fill="white" 
        fill-opacity="0.12" 
        stroke="white" 
        stroke-opacity="0.25" 
        stroke-width="1.5" />

  <!-- Search Lens Ring -->
  <circle cx="30" cy="28" r="12" 
          stroke="url(#fav-accent)" 
          stroke-width="3.5" 
          stroke-linecap="round" />

  <!-- Search Ray Handle -->
  <path d="M39 37 L48 46" 
        stroke="url(#fav-accent)" 
        stroke-width="4" 
        stroke-linecap="round" />

  <!-- Focal Quantum Spark Point -->
  <circle cx="30" cy="28" r="3.5" fill="#FFFFFF" />
  <circle cx="30" cy="28" r="1.5" fill="#0284C7" />
</svg>
