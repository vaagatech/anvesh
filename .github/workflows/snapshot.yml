name: Snapshot build

# On main: install, test, and build a snapshot — never publish.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          check-latest: true

      - name: Use latest npm
        run: npm install -g npm@latest && node -v && npm -v

      - name: Check versions in sync
        run: node scripts/version.mjs check

      - name: Install
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Test
        run: npm test

      - name: Snapshot summary
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "Snapshot build OK for version ${VERSION} (not published)."
