name: Frontend Deployment (Hub UI to S3 + CloudFront)

on:
  push:
    branches: [main, master]
    paths:
      - "apps/hub-ui/**"
      - ".github/workflows/deploy-ui.yml"
  workflow_dispatch:

jobs:
  deploy-ui:
    name: Build & Deploy Search Studio UI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Hub UI SPA
        run: npm run build -w @vaagatech/anvesh-hub-ui

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Deploy to S3 Bucket
        run: |
          BUCKET_NAME="${{ secrets.SEARCH_UI_S3_BUCKET || 'search-ui-vaagatech-com-v8tam2' }}"
          echo "Syncing build artifacts to s3://${BUCKET_NAME}..."
          aws s3 sync apps/hub-ui/dist "s3://${BUCKET_NAME}" --delete

      - name: Invalidate CloudFront Cache
        run: |
          DIST_ID="${{ secrets.CLOUDFRONT_DISTRIBUTION_ID || 'EOD2XZ9XL367N' }}"
          echo "Invalidating CloudFront cache on distribution ${DIST_ID}..."
          aws cloudfront create-invalidation --distribution-id "${DIST_ID}" --paths "/*"
