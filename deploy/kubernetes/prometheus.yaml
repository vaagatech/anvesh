apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: anvesh
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: anvesh
    app.kubernetes.io/vendor: vaagatech
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
      evaluation_interval: 10s

    scrape_configs:
      - job_name: "anvesh-engine"
        static_configs:
          - targets: ["anvesh-engine:3848"]
        metrics_path: /metrics
        scrape_timeout: 5s

      - job_name: "anvesh-spider"
        static_configs:
          - targets: ["anvesh-spider:3851"]
        metrics_path: /metrics
        scrape_timeout: 5s

      - job_name: "anvesh-indexer"
        static_configs:
          - targets: ["anvesh-indexer:3852"]
        metrics_path: /metrics
        scrape_timeout: 5s

      - job_name: "anvesh-hub"
        static_configs:
          - targets: ["anvesh-hub:3849"]
        metrics_path: /hub/metrics
        scrape_timeout: 5s
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: anvesh
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: anvesh
    app.kubernetes.io/vendor: vaagatech
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--web.console.libraries=/usr/share/prometheus/console_libraries"
            - "--web.console.templates=/usr/share/prometheus/consoles"
            - "--web.enable-lifecycle"
          ports:
            - name: web
              containerPort: 9090
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: web
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /-/ready
              port: web
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: storage
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: anvesh
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: anvesh
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: web
      port: 9090
      targetPort: web
