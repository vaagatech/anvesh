<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" width="260" height="64" fill="none">
  <defs>
    <linearGradient id="anvesh-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="anvesh-grad-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="anvesh-beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0" />
    </linearGradient>
    <filter id="anvesh-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Mark -->
  <g transform="translate(6, 6)">
    <!-- Outer Hex Prism Structure -->
    <path d="M26 2 L48 14 L48 38 L26 50 L4 38 L4 14 Z" 
          fill="url(#anvesh-grad-primary)" 
          opacity="0.12" />
    <path d="M26 2 L48 14 L48 38 L26 50 L4 38 L4 14 Z" 
          stroke="url(#anvesh-grad-primary)" 
          stroke-width="2" 
          stroke-linejoin="round" />

    <!-- Vector Convergence Node Lines -->
    <path d="M26 2 L26 26 M48 38 L26 26 M4 38 L26 26" 
          stroke="url(#anvesh-grad-primary)" 
          stroke-width="1.5" 
          stroke-opacity="0.4" />

    <!-- Dynamic Focal Search Ring -->
    <circle cx="26" cy="26" r="13" 
            stroke="url(#anvesh-grad-accent)" 
            stroke-width="3" 
            stroke-linecap="round"
            stroke-dasharray="60 15" 
            filter="url(#anvesh-glow)" />

    <!-- Search Ray Vector / Handle -->
    <path d="M35 35 L47 47" 
          stroke="url(#anvesh-grad-accent)" 
          stroke-width="3.5" 
          stroke-linecap="round" />

    <!-- Inner Core Quantum Pulse Dot -->
    <circle cx="26" cy="26" r="4.5" fill="url(#anvesh-grad-primary)" />
    <circle cx="26" cy="26" r="2" fill="#FFFFFF" />
  </g>

  <!-- Typography: ANVESH -->
  <g transform="translate(68, 42)">
    <text font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
          font-weight="800" 
          font-size="28" 
          letter-spacing="-0.03em" 
          fill="#0F172A">
      ANVESH
    </text>
  </g>

  <!-- Tagline Badge -->
  <g transform="translate(202, 23)">
    <rect x="0" y="0" width="46" height="18" rx="9" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1"/>
    <text x="23" y="13" 
          font-family="'Plus Jakarta Sans', system-ui, sans-serif" 
          font-weight="700" 
          font-size="9" 
          letter-spacing="0.05em" 
          fill="#4F46E5" 
          text-anchor="middle">
      SEARCH
    </text>
  </g>
</svg>
