name: Infrastructure CI/CD (Terraform)

on:
  push:
    branches: [main, master]
    paths:
      - "infra/terraform/**"
      - ".github/workflows/infra.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "infra/terraform/**"
  workflow_dispatch:

jobs:
  terraform:
    name: Terraform Plan & Apply
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Configure OCI Auth & Environment
        env:
          OCI_CONFIG: ${{ secrets.OCI_CONFIG }}
          OCI_KEY: ${{ secrets.OCI_KEY }}
        run: |
          mkdir -p ~/.oci
          if [ -n "$OCI_CONFIG" ]; then
            printf "%s\n" "$OCI_CONFIG" > ~/.oci/config
          fi
          if [ -n "$OCI_KEY" ]; then
            printf "%s\n" "$OCI_KEY" > ~/.oci/oci_api_key.pem
            chmod 600 ~/.oci/oci_api_key.pem
          fi
          if [ -f ~/.oci/config ]; then
            chmod 600 ~/.oci/config
          fi

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        env:
          TF_VAR_aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          TF_VAR_aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_aws_region: ${{ secrets.AWS_REGION || 'us-east-1' }}
          TF_VAR_private_key_path: "/home/runner/.oci/oci_api_key.pem"
        run: terraform plan -no-color

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          TF_VAR_aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          TF_VAR_aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_aws_region: ${{ secrets.AWS_REGION || 'us-east-1' }}
          TF_VAR_private_key_path: "/home/runner/.oci/oci_api_key.pem"
        run: terraform apply -auto-approve
