# 5. Anvesh Hub Control Plane & Service Registry Microservice (Port 3849)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: anvesh-hub
  namespace: anvesh
  labels:
    app.kubernetes.io/name: anvesh-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: anvesh-hub
  template:
    metadata:
      labels:
        app.kubernetes.io/name: anvesh-hub
    spec:
      imagePullSecrets:
        - name: ocir-secret
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: anvesh-hub
          image: hyd.ocir.io/axkdaujrafzw/anvesh-hub:latest
          imagePullPolicy: Always
          command: ["node", "apps/hub-api/dist/cli.js", "serve"]
          ports:
            - name: http
              containerPort: 3849
          envFrom:
            - configMapRef:
                name: anvesh-config
            - secretRef:
                name: anvesh-secrets
          volumeMounts:
            - name: shared-data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /hub/health
              port: 3849
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /hub/health
              port: 3849
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: shared-data
          persistentVolumeClaim:
            claimName: anvesh-shared-data-pvc
---
# Traefik StripPrefix Middleware: strips "/anvesh" so Hub receives "/hub/..." and Engine receives native endpoints
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: anvesh-strip-prefix
  namespace: anvesh
spec:
  stripPrefix:
    prefixes:
      - /anvesh
---
# Ingress routing /anvesh/hub to Hub, /anvesh/spider to Spider, /anvesh/indexer to Indexer, /anvesh to Engine
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: anvesh-ingress
  namespace: anvesh
  annotations:
    ingress.kubernetes.io/ssl-redirect: "false"
    traefik.ingress.kubernetes.io/router.middlewares: anvesh-anvesh-strip-prefix@kubernetescrd
spec:
  rules:
    - http:
        paths:
          - path: /anvesh/hub
            pathType: Prefix
            backend:
              service:
                name: anvesh-hub-service
                port:
                  number: 3849
          - path: /anvesh/spider
            pathType: Prefix
            backend:
              service:
                name: anvesh-spider-service
                port:
                  number: 3851
          - path: /anvesh/indexer
            pathType: Prefix
            backend:
              service:
                name: anvesh-indexer-service
                port:
                  number: 3852
          - path: /anvesh
            pathType: Prefix
            backend:
              service:
                name: anvesh-engine-service
                port:
                  number: 3848
---
# =========================================================================
# Horizontal Pod Autoscalers (75% Target Threshold for ALL Microservices)
# =========================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: anvesh-engine-hpa
  namespace: anvesh
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: anvesh-engine
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: anvesh-hub-hpa
  namespace: anvesh
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: anvesh-hub
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: anvesh-spider-hpa
  namespace: anvesh
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: anvesh-spider
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: anvesh-indexer-hpa
  namespace: anvesh
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: anvesh-indexer
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
---
# =========================================================================
# Prometheus Monitoring Pod & Telemetry Scrapers (Engine, Spider, Indexer, Hub)
# =========================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: anvesh
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: anvesh
    app.kubernetes.io/vendor: vaagatech
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
      evaluation_interval: 10s

    scrape_configs:
      - job_name: "anvesh-engine"
        static_configs:
          - targets: ["anvesh-engine:3848"]
        metrics_path: /metrics
        scrape_timeout: 5s

      - job_name: "anvesh-spider"
        static_configs:
          - targets: ["anvesh-spider:3851"]
        metrics_path: /metrics
        scrape_timeout: 5s

      - job_name: "anvesh-indexer"
        static_configs:
          - targets: ["anvesh-indexer:3852"]
        metrics_path: /metrics
        scrape_timeout: 5s

      - job_name: "anvesh-hub"
        static_configs:
          - targets: ["anvesh-hub:3849"]
        metrics_path: /hub/metrics
        scrape_timeout: 5s
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: anvesh
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: anvesh
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--web.enable-lifecycle"
          ports:
            - name: web
              containerPort: 9090
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: web
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /-/ready
              port: web
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: storage
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: anvesh
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: anvesh
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: web
      port: 9090
      targetPort: web

