name: Backend Deployment (OCIR & K3s)

on:
  push:
    branches: [main, master]
    paths:
      - "apps/engine/**"
      - "apps/spider/**"
      - "apps/indexer/**"
      - "apps/hub-api/**"
      - "packages/**"
      - "infra/k8s/**"
      - "Dockerfile"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

env:
  OCIR_REGISTRY: "hyd.ocir.io"
  OCIR_REPO: "axkdaujrafzw/anvesh"

jobs:
  build-and-push:
    name: Build & Push to OCIR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install Dependencies & Verify Build
        run: |
          npm ci
          npm run build -w @vaagatech/anvesh-shared -w @vaagatech/anvesh-plugins -w @vaagatech/vaakly -w @vaagatech/anvesh-search-adapters -w @vaagatech/anvesh-engine -w @vaagatech/anvesh-spider -w @vaagatech/anvesh-indexer -w @vaagatech/anvesh-hub-api

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Required OCIR Secrets
        run: |
          if [ -z "${{ secrets.OCIR_USERNAME }}" ]; then
            echo "::error::Secret OCIR_USERNAME is missing! Please configure it in Repository Secrets."
            exit 1
          fi
          if [ -z "${{ secrets.OCIR_AUTH_TOKEN }}" ]; then
            echo "::error::Secret OCIR_AUTH_TOKEN is missing! Please configure it in Repository Secrets."
            exit 1
          fi

      - name: Log in to Oracle Cloud Infrastructure Registry (OCIR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.OCIR_REGISTRY }}
          username: ${{ secrets.OCIR_USERNAME }}
          password: ${{ secrets.OCIR_AUTH_TOKEN }}

      - name: Backup Current Latest to Previous Tag in OCIR
        run: |
          docker buildx imagetools create -t ${{ env.OCIR_REGISTRY }}/${{ env.OCIR_REPO }}:previous ${{ env.OCIR_REGISTRY }}/${{ env.OCIR_REPO }}:latest || true

      - name: Build and Push Docker Image to OCIR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.OCIR_REGISTRY }}/${{ env.OCIR_REPO }}:latest
            ${{ env.OCIR_REGISTRY }}/${{ env.OCIR_REPO }}:0.1.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-k3s:
    name: Rollout to K3s Cluster
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Required Deployment Secrets
        run: |
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "::error::Secret SSH_PRIVATE_KEY is missing! Please configure it in Repository Secrets."
            exit 1
          fi
          if [ -z "${{ secrets.K3S_HOST }}" ]; then
            echo "::error::Secret K3S_HOST is missing! Please configure it in Repository Secrets."
            exit 1
          fi

      - name: Setup SSH Key & Known Hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.K3S_HOST }} >> ~/.ssh/known_hosts

      - name: Configure OCIR Secret on K3s Cluster
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.K3S_HOST }} "sudo kubectl create secret docker-registry ocir-secret \
            --docker-server='${{ env.OCIR_REGISTRY }}' \
            --docker-username='${{ secrets.OCIR_USERNAME }}' \
            --docker-password='${{ secrets.OCIR_AUTH_TOKEN }}' \
            --docker-email='admin@vaagatech.com' \
            -n anvesh \
            --dry-run=client -o yaml | sudo kubectl apply -f -"

      - name: Sync K8s Manifests & Apply
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.K3S_HOST }} "mkdir -p ~/searchengine/infra/k8s"
          scp -i ~/.ssh/id_rsa infra/k8s/anvesh-k8s.yaml ubuntu@${{ secrets.K3S_HOST }}:~/searchengine/infra/k8s/anvesh-k8s.yaml
          ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.K3S_HOST }} "sudo kubectl apply -f ~/searchengine/infra/k8s/anvesh-k8s.yaml"

      - name: Rollout Restart & Verify Status (With Auto-Rollback)
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.K3S_HOST }} "
            set -e
            echo '==> Triggering rollout restart...'
            sudo kubectl rollout restart deployment/anvesh-engine deployment/anvesh-spider deployment/anvesh-indexer deployment/anvesh-hub -n anvesh
            
            echo '==> Verifying rollout health...'
            if ! sudo kubectl rollout status deployment/anvesh-engine -n anvesh --timeout=120s || \
               ! sudo kubectl rollout status deployment/anvesh-hub -n anvesh --timeout=120s || \
               ! sudo kubectl rollout status deployment/anvesh-indexer -n anvesh --timeout=120s || \
               ! sudo kubectl rollout status deployment/anvesh-spider -n anvesh --timeout=120s; then
              echo '::error::Deployment rollout verification failed! Rolling back to previous working version...'
              sudo kubectl rollout undo deployment/anvesh-engine deployment/anvesh-spider deployment/anvesh-indexer deployment/anvesh-hub -n anvesh
              exit 1
            fi
            echo '==> Deployment successful. Pruning dangling host images...'
            sudo crictl rmi --prune || true
          "

