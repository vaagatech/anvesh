name: Backend Deployment (Modular OCIR & K3s)

on:
  push:
    branches: [main, master]
    paths:
      - "apps/**"
      - "packages/**"
      - "infra/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:
    inputs:
      target_service:
        description: "Service to build and deploy (or 'all')"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - engine
          - spider
          - indexer
          - hub

env:
  OCIR_REGISTRY: "hyd.ocir.io"
  OCIR_NAMESPACE: "axkdaujrafzw"

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      engine: ${{ steps.filter.outputs.engine == 'true' || github.event_name == 'workflow_dispatch' && (inputs.target_service == 'all' || inputs.target_service == 'engine') }}
      spider: ${{ steps.filter.outputs.spider == 'true' || github.event_name == 'workflow_dispatch' && (inputs.target_service == 'all' || inputs.target_service == 'spider') }}
      indexer: ${{ steps.filter.outputs.indexer == 'true' || github.event_name == 'workflow_dispatch' && (inputs.target_service == 'all' || inputs.target_service == 'indexer') }}
      hub: ${{ steps.filter.outputs.hub == 'true' || github.event_name == 'workflow_dispatch' && (inputs.target_service == 'all' || inputs.target_service == 'hub') }}
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Paths Filter
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            engine:
              - 'apps/engine/**'
              - 'packages/shared/**'
              - 'packages/plugins/**'
              - 'packages/vaakly/**'
              - 'infra/docker/Dockerfile.engine'
              - 'infra/k8s/**'
              - '.github/workflows/deploy-backend.yml'
            spider:
              - 'apps/spider/**'
              - 'packages/shared/**'
              - 'infra/docker/Dockerfile.spider'
              - 'infra/k8s/**'
              - '.github/workflows/deploy-backend.yml'
            indexer:
              - 'apps/indexer/**'
              - 'apps/engine/**'
              - 'packages/**'
              - 'infra/docker/Dockerfile.indexer'
              - 'infra/k8s/**'
              - '.github/workflows/deploy-backend.yml'
            hub:
              - 'apps/hub-api/**'
              - 'packages/shared/**'
              - 'packages/search-adapters/**'
              - 'infra/docker/Dockerfile.hub'
              - 'infra/k8s/**'
              - '.github/workflows/deploy-backend.yml'

      - name: Compute Build Matrix
        id: set-matrix
        run: |
          SERVICES=()
          
          IS_DISPATCH="${{ github.event_name == 'workflow_dispatch' }}"
          TARGET="${{ inputs.target_service }}"
          
          if [ "$IS_DISPATCH" = "true" ]; then
            if [ "$TARGET" = "all" ] || [ "$TARGET" = "engine" ]; then SERVICES+=('{"name":"engine","repo":"anvesh-engine","dockerfile":"infra/docker/Dockerfile.engine","deployment":"anvesh-engine"}'); fi
            if [ "$TARGET" = "all" ] || [ "$TARGET" = "spider" ]; then SERVICES+=('{"name":"spider","repo":"anvesh-spider","dockerfile":"infra/docker/Dockerfile.spider","deployment":"anvesh-spider"}'); fi
            if [ "$TARGET" = "all" ] || [ "$TARGET" = "indexer" ]; then SERVICES+=('{"name":"indexer","repo":"anvesh-indexer","dockerfile":"infra/docker/Dockerfile.indexer","deployment":"anvesh-indexer"}'); fi
            if [ "$TARGET" = "all" ] || [ "$TARGET" = "hub" ]; then SERVICES+=('{"name":"hub","repo":"anvesh-hub","dockerfile":"infra/docker/Dockerfile.hub","deployment":"anvesh-hub"}'); fi
          else
            if [ "${{ steps.filter.outputs.engine }}" = "true" ]; then SERVICES+=('{"name":"engine","repo":"anvesh-engine","dockerfile":"infra/docker/Dockerfile.engine","deployment":"anvesh-engine"}'); fi
            if [ "${{ steps.filter.outputs.spider }}" = "true" ]; then SERVICES+=('{"name":"spider","repo":"anvesh-spider","dockerfile":"infra/docker/Dockerfile.spider","deployment":"anvesh-spider"}'); fi
            if [ "${{ steps.filter.outputs.indexer }}" = "true" ]; then SERVICES+=('{"name":"indexer","repo":"anvesh-indexer","dockerfile":"infra/docker/Dockerfile.indexer","deployment":"anvesh-indexer"}'); fi
            if [ "${{ steps.filter.outputs.hub }}" = "true" ]; then SERVICES+=('{"name":"hub","repo":"anvesh-hub","dockerfile":"infra/docker/Dockerfile.hub","deployment":"anvesh-hub"}'); fi
          fi

          # Default to empty array if no service changed
          if [ ${#SERVICES[@]} -eq 0 ]; then
            echo "matrix={\"include\":[]}" >> "$GITHUB_OUTPUT"
          else
            JSON=$(IFS=,; echo "[${SERVICES[*]}]")
            echo "matrix={\"include\":$JSON}" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    name: Build & Push (${{ matrix.name }})
    needs: detect-changes
    if: ${{ fromJson(needs.detect-changes.outputs.matrix).include[0] != null }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Required OCIR Secrets
        run: |
          if [ -z "${{ secrets.OCIR_USERNAME }}" ]; then
            echo "::error::Secret OCIR_USERNAME is missing! Please configure it in Repository Secrets."
            exit 1
          fi
          if [ -z "${{ secrets.OCIR_AUTH_TOKEN }}" ]; then
            echo "::error::Secret OCIR_AUTH_TOKEN is missing! Please configure it in Repository Secrets."
            exit 1
          fi

      - name: Log in to Oracle Cloud Infrastructure Registry (OCIR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.OCIR_REGISTRY }}
          username: ${{ secrets.OCIR_USERNAME }}
          password: ${{ secrets.OCIR_AUTH_TOKEN }}

      - name: Backup Current Latest to Previous Tag in OCIR
        run: |
          IMAGE_URI="${{ env.OCIR_REGISTRY }}/${{ env.OCIR_NAMESPACE }}/${{ matrix.repo }}"
          echo "==> Backing up current $IMAGE_URI:latest to :previous..."
          docker buildx imagetools create -t "$IMAGE_URI:previous" "$IMAGE_URI:latest" || true

      - name: Build and Push Docker Image to OCIR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.OCIR_REGISTRY }}/${{ env.OCIR_NAMESPACE }}/${{ matrix.repo }}:latest
            ${{ env.OCIR_REGISTRY }}/${{ env.OCIR_NAMESPACE }}/${{ matrix.repo }}:0.1.0
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy-k3s:
    name: Rollout to K3s Cluster
    needs: [detect-changes, build-and-push]
    if: ${{ always() && needs.build-and-push.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Required Deployment Secrets
        run: |
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "::error::Secret SSH_PRIVATE_KEY is missing! Please configure it in Repository Secrets."
            exit 1
          fi
          if [ -z "${{ secrets.K3S_HOST }}" ]; then
            echo "::error::Secret K3S_HOST is missing! Please configure it in Repository Secrets."
            exit 1
          fi

      - name: Setup SSH Key & Known Hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.K3S_HOST }} >> ~/.ssh/known_hosts

      - name: Configure OCIR Secret on K3s Cluster
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.K3S_HOST }} "sudo kubectl create secret docker-registry ocir-secret \
            --docker-server='${{ env.OCIR_REGISTRY }}' \
            --docker-username='${{ secrets.OCIR_USERNAME }}' \
            --docker-password='${{ secrets.OCIR_AUTH_TOKEN }}' \
            --docker-email='admin@vaagatech.com' \
            -n anvesh \
            --dry-run=client -o yaml | sudo kubectl apply -f -"

      - name: Sync K8s Manifests & Apply
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.K3S_HOST }} "mkdir -p ~/searchengine/infra/k8s"
          scp -i ~/.ssh/id_rsa infra/k8s/anvesh-k8s.yaml ubuntu@${{ secrets.K3S_HOST }}:~/searchengine/infra/k8s/anvesh-k8s.yaml
          ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.K3S_HOST }} "sudo kubectl apply -f ~/searchengine/infra/k8s/anvesh-k8s.yaml"

      - name: Targeted Rollout Restart & Verify Status
        run: |
          DEPLOYMENTS=()
          if [ "${{ needs.detect-changes.outputs.engine }}" = "true" ]; then DEPLOYMENTS+=("deployment/anvesh-engine"); fi
          if [ "${{ needs.detect-changes.outputs.spider }}" = "true" ]; then DEPLOYMENTS+=("deployment/anvesh-spider"); fi
          if [ "${{ needs.detect-changes.outputs.indexer }}" = "true" ]; then DEPLOYMENTS+=("deployment/anvesh-indexer"); fi
          if [ "${{ needs.detect-changes.outputs.hub }}" = "true" ]; then DEPLOYMENTS+=("deployment/anvesh-hub"); fi
          
          if [ ${#DEPLOYMENTS[@]} -eq 0 ]; then
            echo "No microservice deployments need to be restarted."
            exit 0
          fi

          DEPLOY_LIST="${DEPLOYMENTS[*]}"
          echo "==> Deploying targets: $DEPLOY_LIST"

          ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.K3S_HOST }} "
            set -e
            echo '==> Restarting updated microservices...'
            sudo kubectl rollout restart $DEPLOY_LIST -n anvesh
            
            echo '==> Verifying rollout health...'
            for dep in $DEPLOY_LIST; do
              echo \"Checking status for \$dep...\"
              if ! sudo kubectl rollout status \$dep -n anvesh --timeout=120s; then
                echo \"::error::Rollout failed for \$dep! Rolling back to previous working image...\"
                sudo kubectl rollout undo \$dep -n anvesh
                exit 1
              fi
            done
            
            echo '==> Rollout successful. Pruning dangling host images...'
            sudo crictl rmi --prune || true
          "


